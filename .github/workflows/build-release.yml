name: Build & Release DNS Pulse APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-and-release:
    name: Build Signed APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Ensure SDK 36
        run: |
          set +o pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_DIR"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -maxdepth 3 -name "sdkmanager" -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            echo "Found sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36.1" "build-tools;36.0.0" || \
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "Warning: sdkmanager not found under $SDK_DIR/cmdline-tools"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Determine Dynamic Version
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_VERSION="1.0"
          TOTAL_COMMITS=$(git rev-list --count HEAD 2>/dev/null || echo "1")

          # Inspect existing GitHub releases so versionCode & versionName NEVER downgrade
          # even after squash commits, history resets, or manual workflow_dispatch runs.
          LATEST_TAG=$(gh release list --limit 20 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          LAST_PATCH=0
          if [[ "$LATEST_TAG" =~ ([0-9]+)$ ]]; then
            LAST_PATCH="${BASH_REMATCH[1]}"
          fi

          NEXT_PATCH=$((TOTAL_COMMITS))
          if [ "$LAST_PATCH" -ge "$NEXT_PATCH" ]; then
            NEXT_PATCH=$((LAST_PATCH + 1))
          fi

          VERSION_CODE=$((100 + NEXT_PATCH))
          VERSION_NAME="${BASE_VERSION}.${NEXT_PATCH}"

          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=v${VERSION_NAME}" >> $GITHUB_ENV
          echo "Determined Version Name: ${VERSION_NAME} (code: ${VERSION_CODE}, commits: ${TOTAL_COMMITS}, last_tag: ${LATEST_TAG:-none})"

      - name: Restore Keystore & Verify Signing Identity
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored persistent debug.keystore from debug.keystore.base64."
          elif [ ! -f "debug.keystore" ]; then
            echo "ERROR: Neither debug.keystore.base64 nor debug.keystore is present; refusing to mint an incompatible key."
            exit 1
          fi

          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build Signed APK
        run: |
          gradle assembleDebug -PversionCode=${{ env.VERSION_CODE }} -PversionName=${{ env.VERSION_NAME }} --no-daemon --stacktrace

      - name: Prepare & Verify APK Artifact
        id: prepare_artifact
        run: |
          OUTPUT_APK="DNS Pulse.v${{ env.VERSION_NAME }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${OUTPUT_APK}"

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -maxdepth 2 -name "apksigner" -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "${OUTPUT_APK}"
          fi

          echo "APK_FILE=${OUTPUT_APK}" >> $GITHUB_ENV
          echo "Prepared & verified APK: ${OUTPUT_APK}"

      - name: Publish Latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ env.TAG_NAME }}"
          RELEASE_TITLE="DNS Pulse ${TAG_NAME}"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release delete "$TAG_NAME" --yes --cleanup-tag || true
          fi

          NOTES=$(cat <<EOF
          ### ⚡ DNS Pulse - New Update Released

          - **Application:** DNS Pulse (Pulse Suite)
          - **Version:** \`${TAG_NAME}\` (Build \`${{ env.VERSION_CODE }}\`)
          - **Seamless Updates:** Signed with the consistent project key, allowing seamless update installation over existing versions without uninstalling.

          #### What's Included:
          - One-Tap AdGuard (\`dns.adguard.com\`) Private DNS (DoT) Controller
          - Shizuku API Bridge Service for non-root system DNS management
          - Local Zero-Root VPN DNS Tunnel (IPv4 & IPv6)
          - Live Asynchronous Latency Ping Benchmark & Auto-Fastest selector
          - In-app GitHub Releases auto-updater
          - Android Quick Settings Tile
          EOF
          )

          echo "Creating release $TAG_NAME..."
          gh release create "$TAG_NAME" "${{ env.APK_FILE }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Clean All Older Releases & Tags (Keep Only Newest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="${{ env.TAG_NAME }}"
          echo "Removing all releases older than $NEW_TAG..."

          OLD_RELEASES=$(gh release list --limit 100 --json tagName -q ".[] | select(.tagName != \"$NEW_TAG\") | .tagName" 2>/dev/null || true)
          for tag in $OLD_RELEASES; do
            echo "Deleting older release: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done

          git fetch --tags --prune || true
          for tag in $(git tag -l 'v*' | grep -v "^${NEW_TAG}$" || true); do
            echo "Deleting leftover tag: $tag"
            git push origin --delete "$tag" 2>/dev/null || true
          done

      - name: Clean All Older GitHub Actions Runs (Keep Only Current)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_RUN_ID="${{ github.run_id }}"
          echo "Removing all workflow runs older than current run ($CURRENT_RUN_ID)..."

          OLD_RUNS=$(gh run list --limit 200 --json databaseId -q ".[] | select(.databaseId != ${CURRENT_RUN_ID}) | .databaseId" 2>/dev/null || true)
          for run_id in $OLD_RUNS; do
            echo "Deleting older workflow run: $run_id"
            gh run delete "$run_id" || true
          done
          echo "Cleanup complete: only the latest release and current workflow run remain."
